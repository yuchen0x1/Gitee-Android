name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Git tag to publish'
        required: true
        default: 'v1.4.4'

permissions:
  contents: write

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
      - name: Check tag and app version
        shell: bash
        run: |
          test "${RELEASE_TAG#v}" = "$(sed -n 's/^version: //p' pubspec.yaml | cut -d+ -f1)"
      - name: Validate release notes
        run: python3 tool/release_notes.py --version "${RELEASE_TAG}" --output "${RUNNER_TEMP}/gitee-client-release-notes.md"

  android:
    name: Android packages
    needs: validate
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true
      - name: Configure Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        shell: bash
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/release-key.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=../release-key.jks
          EOF
      - run: flutter pub get
      - run: flutter build apk --release
      - run: flutter build apk --release --split-per-abi
      - run: flutter build appbundle --release
      - name: Verify release APK signatures
        env:
          EXPECTED_CERT_SHA256: '253e438daf6f55dfc10e232faafc3725eecdf44c691e1849e9c138d9b85fca81'
        shell: bash
        run: |
          APKSIGNER=$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -x "$APKSIGNER"
          for apk in build/app/outputs/flutter-apk/*-release.apk; do
            "$APKSIGNER" verify --verbose --print-certs "$apk"
            cert_digest=$("$APKSIGNER" verify --print-certs "$apk" \
              | sed -n -E 's/^(Signer #1|V2 Signer): certificate SHA-256 digest: ([0-9a-fA-F]{64})$/\2/p' \
              | tr '[:upper:]' '[:lower:]')
            test -n "$cert_digest"
            test "$cert_digest" = "$EXPECTED_CERT_SHA256"
          done
      - name: Prepare Android assets
        shell: bash
        run: |
          mkdir -p release-assets
          cp build/app/outputs/flutter-apk/app-release.apk release-assets/gitee-client-${RELEASE_TAG}-android-universal.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release-assets/gitee-client-${RELEASE_TAG}-android-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release-assets/gitee-client-${RELEASE_TAG}-android-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk release-assets/gitee-client-${RELEASE_TAG}-android-x86_64.apk
          cp build/app/outputs/bundle/release/app-release.aab release-assets/gitee-client-${RELEASE_TAG}-android.aab
          sha256sum release-assets/gitee-client-* > release-assets/SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: android-release-assets
          path: release-assets/*

  publish:
    name: Publish GitHub Release
    needs: [validate, android]
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
      - name: Prepare release notes
        run: python3 tool/release_notes.py --version "${RELEASE_TAG}" --output "${RUNNER_TEMP}/gitee-client-release-notes.md"
      - uses: actions/download-artifact@v8
        with:
          pattern: '*-release-assets'
          merge-multiple: true
          path: release-assets
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${RELEASE_TAG}" release-assets/* --repo "${GITHUB_REPOSITORY}" --title "Gitee Client ${RELEASE_TAG}" --verify-tag --notes-file "${RUNNER_TEMP}/gitee-client-release-notes.md"
